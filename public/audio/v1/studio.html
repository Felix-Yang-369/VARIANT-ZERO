<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VARIANT ZERO · 原声试听室</title><style>body{font:15px/1.65 system-ui;margin:0;padding:36px 22px;background:#091f19;color:#e7efe1}main{max-width:1000px;margin:auto}h1,h2{font-family:Georgia,'Songti SC',serif;font-weight:500}h1{font-size:34px}p,small{color:#b5cdbd}.tracks{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{border:1px solid #9aceb63d;border-radius:12px;padding:20px;background:#13342a}article h2{margin:0 0 12px}article audio{width:100%;margin-top:12px}.effects{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}button,a{font:inherit;color:inherit;background:#173c2e;border:1px solid #94c7ac4a;border-radius:8px;padding:10px 12px;cursor:pointer;text-decoration:none}button:hover{background:#29543e}button:focus-visible,a:focus-visible{outline:2px solid #a5e8d0;outline-offset:3px}button small{display:block}header{margin-bottom:28px}.status{min-height:25px;color:#bcebd4}@media(max-width:620px){.tracks{grid-template-columns:1fr}.effects{grid-template-columns:1fr 1fr}}</style><main><header><small>ORIGINAL SOUNDTRACK / 01</small><h1>让生命，有自己的声音。</h1><p>五段原创配乐，三十二类分层音效。采用程序编曲与合成制作，无远程音频素材依赖。</p><a href="/">返回研究所</a></header><div class="tracks" id="tracks"></div><h2>声音标本</h2><p>点击试听；重复点击会轮换该声音的不同变体。</p><p class="status" id="status" aria-live="polite"></p><div class="effects" id="effects"></div></main><script>const counters={},players=[];let fx;fetch('manifest.json').then(r=>r.json()).then(m=>{document.querySelector('#tracks').innerHTML=Object.values(m.music).map(t=>`<article><h2>${t.title}</h2><small>${t.bpm} BPM · ${Math.round(t.duration)} 秒 · 立体声</small><p>${t.description}</p><audio controls preload="none" src="${t.url}"></audio></article>`).join('');document.querySelectorAll('audio').forEach(a=>{players.push(a);a.volume=.45;a.addEventListener('play',()=>{players.filter(x=>x!==a).forEach(x=>x.pause());fx?.pause()})});document.querySelector('#effects').innerHTML=Object.entries(m.sfx).map(([id,s])=>`<button data-sound="${id}">${s.title}<small>${s.duration}s · ${s.urls.length} 个变体</small></button>`).join('');document.querySelector('#effects').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=m.sfx[b.dataset.sound],i=counters[b.dataset.sound]??0;counters[b.dataset.sound]=i+1;fx?.pause();players.forEach(a=>a.pause());fx=new Audio(s.urls[i%s.urls.length]);fx.volume=.6;fx.play().then(()=>document.querySelector('#status').textContent=`${s.title} · 变体 ${i%s.urls.length+1}`).catch(()=>document.querySelector('#status').textContent='声音暂时无法播放，请再试一次。');})});</script></html>
